<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#39c46e">
<title>STOP · שתפו מקומות שביקרתם בהם</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MTIgNTEyIiB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIj4KICA8Y2lyY2xlIGN4PSIyNTYiIGN5PSIyNTYiIHI9IjI0MCIgZmlsbD0iIzM5YzQ2ZSIgLz4KCiAgPHBhdGggZD0iTSAxMjAgMTIwIEwgMzkyIDEyMCBRIDQwMCAxMjAgNDAwIDEyOCBMIDQwMCAxODIgUSA0MDAgMTkwIDM5MiAxOTAgTCAyOTAgMTkwIFEgMjgyIDE5MCAyODIgMTk4IEwgMjgyIDM5MiBRIDI4MiA0MDAgMjc0IDQwMCBMIDIzOCA0MDAgUSAyMzAgNDAwIDIzMCAzOTIgTCAyMzAgMTk4IFEgMjMwIDE5MCAyMjIgMTkwIEwgMTIwIDE5MCBRIDExMiAxOTAgMTEyIDE4MiBMIDExMiAxMjggUSAxMTIgMTIwIDEyMCAxMjAgWiIgCiAgICAgICAgZmlsbD0iI0ZGRkZGRiIgLz4KPC9zdmc+Cg==">
<style>
  :root{
    --green:#39c46e;
    --green-dark:#22a35a;
    --green-light:#98FB98;
    --bg:#f2f5f3;
    --card:#ffffff;
    --ink:#12211a;
    --muted:#6b7c73;
    --line:#e3e9e5;
    --shadow:0 6px 22px rgba(30,80,50,.08);
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Rubik','Segoe UI',Tahoma,sans-serif;
    background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}

  /* ===== Buttons ===== */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border:none;border-radius:26px;font-family:inherit;font-weight:700;
    cursor:pointer;transition:.15s;white-space:nowrap;line-height:1;
    padding:12px 22px;font-size:15px;
  }
  .btn:active{transform:scale(.97)}
  .btn-primary{background:var(--green);color:#fff;box-shadow:0 4px 14px rgba(57,196,110,.35)}
  .btn-primary:hover{background:var(--green-dark)}

  /* ===== Splash intro ===== */
  .splash{
    position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    background:radial-gradient(circle at 50% 45%, #eafaf0 0%, var(--bg) 70%);
    opacity:1;transition:opacity .7s ease;
  }
  .splash.fade-out{opacity:0;pointer-events:none}
  .splash .mark{
    width:160px;height:160px;
    transform:scale(.4);opacity:0;
    animation:splash-grow .9s cubic-bezier(.22,.9,.35,1) forwards;
  }
  .splash .mark svg{width:100%;height:100%;display:block}
  @keyframes splash-grow{
    0%{transform:scale(.4);opacity:0}
    35%{opacity:1}
    100%{transform:scale(9);opacity:1}
  }
  body.splash-active{overflow:hidden;height:100vh}

  /* ===== Header (app) ===== */
  header{
    position:sticky;top:0;z-index:50;
    background:var(--card);
    border-bottom:1px solid var(--line);
    box-shadow:0 2px 10px rgba(0,0,0,.03);
  }
  .bar{
    max-width:1180px;margin:0 auto;padding:12px 20px;
    display:flex;align-items:center;gap:18px;
  }
  .logo{display:flex;align-items:center;gap:10px;cursor:pointer}
  .logo .mark-sm{
    width:44px;height:44px;border-radius:12px;overflow:hidden;
    box-shadow:0 4px 12px rgba(57,196,110,.35);flex:none;
  }
  .logo .mark-sm svg{width:100%;height:100%}
  .logo .name{font-size:26px;font-weight:800;letter-spacing:1px;color:var(--green-dark)}
  .logo .name small{font-size:12px;font-weight:500;color:var(--muted);display:block;letter-spacing:0}

  .search{
    flex:1;max-width:560px;position:relative;
  }
  .search input{
    width:100%;padding:12px 44px 12px 16px;border-radius:30px;
    border:1.5px solid var(--line);background:#f7faf8;font-size:15px;
    font-family:inherit;transition:.2s;
  }
  .search input:focus{outline:none;border-color:var(--green);background:#fff;box-shadow:0 0 0 4px rgba(57,196,110,.12)}
  .search .icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:18px}

  .actions{display:flex;align-items:center;gap:10px;margin-inline-start:auto}
  .btn-sm{padding:10px 20px;font-size:15px}
  .avatar{
    width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#39c46e,#22a35a);
    color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px;cursor:pointer;flex:none;
  }

  /* ===== Layout ===== */
  .wrap{max-width:1180px;margin:0 auto;padding:22px 20px;display:grid;grid-template-columns:220px 1fr;gap:22px}
  /* allow grid tracks to shrink below intrinsic content width (prevents horizontal overflow) */
  .wrap > aside,.wrap > main{min-width:0}

  /* Sidebar */
  aside{position:sticky;top:88px;align-self:start}
  .cats{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px}
  .cats h3{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:8px 12px}
  .cat{
    display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;
    cursor:pointer;font-size:15px;font-weight:500;transition:.12s;
  }
  .cat:hover{background:#f0f7f2}
  .cat.active{background:var(--green);color:#fff}
  .cat .emoji{font-size:19px}

  /* Feed */
  .feed-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
  .feed-head h2{font-size:22px;font-weight:800}
  .feed-head .sub{color:var(--muted);font-size:14px;margin-top:2px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{
    padding:7px 15px;border-radius:20px;background:var(--card);border:1.5px solid var(--line);
    font-size:14px;cursor:pointer;font-weight:500;transition:.12s;
  }
  .chip:hover{border-color:var(--green)}
  .chip.active{background:var(--green);color:#fff;border-color:var(--green)}

  /* Grid of place squares */
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;
  }
  .ad{
    background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);
    cursor:pointer;transition:.18s;display:flex;flex-direction:column;
  }
  .ad:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(30,80,50,.15)}
  .ad .cover{
    height:150px;display:grid;place-items:center;font-size:56px;position:relative;overflow:hidden;
  }
  .ad .cover img{width:100%;height:100%;object-fit:cover}
  .ad .price{
    position:absolute;bottom:10px;inset-inline-start:10px;
    background:rgba(255,255,255,.95);color:var(--green-dark);font-weight:800;font-size:15px;
    padding:5px 12px;border-radius:20px;box-shadow:0 2px 8px rgba(0,0,0,.1);
  }
  .ad .tag{
    position:absolute;top:10px;inset-inline-end:10px;background:rgba(18,33,26,.75);color:#fff;
    font-size:11px;padding:4px 10px;border-radius:20px;font-weight:600;
  }
  .ad .body{padding:14px;flex:1;display:flex;flex-direction:column;gap:6px}
  .ad .body h4{font-size:16px;font-weight:700;line-height:1.3}
  .ad .body p{font-size:13px;color:var(--muted);line-height:1.5;flex:1}
  .ad .meta{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
  .ad .meta .loc{display:flex;align-items:center;gap:4px;min-width:0}
  .ad .meta .loc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .reactions{display:flex;align-items:center;gap:6px;flex:none}
  .like-btn{
    display:inline-flex;align-items:center;gap:4px;flex:none;
    border:1.5px solid var(--line);background:#fff;color:var(--muted);
    border-radius:20px;padding:5px 10px;font-size:13px;font-weight:600;
    font-family:inherit;cursor:pointer;transition:.15s;line-height:1;
  }
  .like-btn .emoji{font-size:15px}
  .like-btn:hover{border-color:var(--green);color:var(--green-dark)}
  .like-btn:active{transform:scale(.9)}
  .share-btn{
    display:inline-flex;align-items:center;gap:6px;margin-top:14px;
    border:none;background:var(--green);color:#fff;
    border-radius:22px;padding:10px 18px;font-size:15px;font-weight:700;
    font-family:inherit;cursor:pointer;transition:.15s;line-height:1;
  }
  .share-btn .emoji{font-size:17px}
  .share-btn:hover{background:var(--green-dark)}
  .share-btn:active{transform:scale(.95)}
  #toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
    background:#1f2d26;color:#fff;padding:11px 18px;border-radius:24px;
    font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);
    opacity:0;pointer-events:none;transition:.25s;z-index:1000;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .like-btn.reacted{background:#eafaf0;border-color:var(--green);color:var(--green-dark)}

  .empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)}
  .empty .big{font-size:52px;margin-bottom:10px}

  /* ===== Modal (new post) ===== */
  .overlay{
    position:fixed;inset:0;background:rgba(18,33,26,.5);z-index:100;
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .overlay.show{display:flex}
  .modal{
    background:var(--card);border-radius:22px;width:100%;max-width:480px;
    padding:26px;box-shadow:0 30px 60px rgba(0,0,0,.3);
    max-height:90vh;overflow:auto;
  }
  .modal h2{font-size:20px;margin-bottom:4px}
  .modal .hint{color:var(--muted);font-size:14px;margin-bottom:18px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
  .field input,.field textarea,.field select{
    width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;
    font-family:inherit;font-size:15px;background:#f7faf8;
  }
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--green);background:#fff}
  .field textarea{resize:vertical;min-height:70px}
  .upload-box{
    display:flex;align-items:center;justify-content:center;
    border:1.5px dashed var(--line);border-radius:12px;background:#f7faf8;
    height:130px;cursor:pointer;overflow:hidden;transition:.15s;color:var(--muted);font-size:14px;
  }
  .upload-box:hover{border-color:var(--green);background:#eafaf0}
  .upload-box img{width:100%;height:100%;object-fit:cover}
  .emoji-pick{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .emoji-pick span{
    font-size:24px;padding:6px;border-radius:10px;cursor:pointer;border:2px solid transparent;
  }
  .emoji-pick span.sel{border-color:var(--green);background:#eafaf0}
  .modal-actions{display:flex;gap:10px;margin-top:8px}
  .btn-ghost-modal{background:#eef2ef;color:var(--ink)}
  .btn-ghost-modal:hover{background:#e0e8e3}
  .req{color:#e0335f}

  /* ===== Post detail modal ===== */
  .post-modal{padding:0;overflow:hidden;display:flex;flex-direction:column}
  .modal-close{
    position:absolute;top:12px;inset-inline-start:12px;z-index:2;
    width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;
    background:rgba(255,255,255,.9);color:var(--ink);font-size:16px;font-weight:700;
    display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  .post-cover{position:relative;display:grid;place-items:center;font-size:72px;flex:none;overflow:hidden}
  .post-cover.no-img{height:170px}
  /* blurred fill so contained vertical/horizontal images have no empty bars */
  .post-cover::before{content:"";position:absolute;inset:0;background:inherit;background-size:cover;background-position:center;filter:blur(22px) brightness(.85);transform:scale(1.1)}
  /* cap height so the post bottom (text + reactions) always stays visible */
  .post-cover img{position:relative;width:100%;max-height:min(45vh,320px);object-fit:contain;display:block}
  .post-detail{padding:18px 22px 8px}
  .post-tags{display:flex;gap:8px;margin-bottom:8px}
  .post-cat{background:var(--green);color:#fff;font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px}
  .post-price{background:#f0f7f2;color:var(--green-dark);font-size:13px;font-weight:800;padding:4px 12px;border-radius:20px}
  .post-modal h2{font-size:22px;margin-bottom:4px}
  .post-byline{color:var(--muted);font-size:13px;margin-bottom:10px}
  .post-byline b{color:var(--ink)}
  .post-desc{font-size:15px;line-height:1.6;color:#2a3b32}
  .post-meta{color:var(--muted);font-size:13px;margin-top:10px}

  .comments{border-top:1px solid var(--line);padding:16px 22px 20px;overflow:auto;flex:1}
  .comments h3{font-size:16px;margin-bottom:12px}
  .comment-list{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
  .comment{background:#f7faf8;border-radius:14px;padding:10px 14px}
  .comment .c-head{display:flex;align-items:baseline;gap:8px;margin-bottom:3px}
  .comment .c-author{font-weight:700;font-size:14px}
  .comment .c-time{color:var(--muted);font-size:12px}
  .comment .c-body{font-size:14px;line-height:1.5;color:#2a3b32;word-break:break-word}
  .comments-empty{color:var(--muted);font-size:14px;text-align:center;padding:12px}
  .comment-form{display:flex;flex-direction:column;gap:8px}
  .comment-form input{
    width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;
    font-family:inherit;font-size:15px;background:#f7faf8;
  }
  .comment-form input:focus{outline:none;border-color:var(--green);background:#fff}
  .comment-row{display:flex;gap:8px}
  .comment-row input{flex:1}

  footer{text-align:center;color:var(--muted);font-size:13px;padding:30px}

  /* Floating action button (mobile only) */
  .fab{
    display:none;position:fixed;z-index:60;
    inset-inline-end:18px;bottom:calc(18px + env(safe-area-inset-bottom));
    width:58px;height:58px;border-radius:50%;border:none;cursor:pointer;
    background:var(--green);color:#fff;font-size:30px;line-height:1;
    box-shadow:0 8px 24px rgba(57,196,110,.5);
  }
  .fab:active{transform:scale(.92)}

  /* ===== Tablet ===== */
  @media(max-width:860px){
    .wrap{grid-template-columns:1fr;padding:16px}
    aside{position:static}
    .cats{display:flex;overflow-x:auto;gap:6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .cats::-webkit-scrollbar{display:none}
    .cats h3{display:none}
    .cat{white-space:nowrap}
    .search{max-width:none}
    .logo .name small{display:none}
  }

  /* ===== Phone ===== */
  @media(max-width:640px){
    .bar{
      padding:10px 14px;gap:10px;flex-wrap:wrap;
    }
    .logo{order:1}
    .logo .mark-sm{width:38px;height:38px}
    .logo .name{font-size:22px}
    /* hide the header share button — replaced by the FAB */
    .actions .btn{display:none}
    .actions{order:2;margin-inline-start:auto;gap:8px}
    .avatar{width:38px;height:38px;font-size:15px}
    .search{order:3;flex-basis:100%;max-width:none}
    .search input{padding:11px 42px 11px 14px}

    .wrap{padding:14px 12px 90px}
    .feed-head h2{font-size:19px}
    .feed-head .sub{font-size:13px}
    .chips{width:100%;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
    .chips::-webkit-scrollbar{display:none}
    .chip{flex:none}

    /* two columns on phones for a denser, app-like feel */
    .grid{grid-template-columns:repeat(2,1fr);gap:12px}
    .ad .cover{height:120px;font-size:44px}
    .ad .body{padding:10px;gap:4px}
    .ad .body h4{font-size:14px}
    .ad .body p{font-size:12px;-webkit-line-clamp:2;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
    .ad .meta{flex-direction:column;align-items:stretch;gap:8px;font-size:11px}
    .reactions{justify-content:space-between;gap:4px}
    .like-btn{flex:1;justify-content:center;padding:6px 4px;font-size:12px;gap:2px}
    .like-btn .emoji{font-size:14px}

    .fab{display:grid;place-items:center}

    /* full-screen modal on phones */
    .overlay{padding:0;align-items:stretch}
    .modal{
      max-width:none;border-radius:0;width:100%;max-height:100vh;height:100%;
      padding:22px 18px calc(22px + env(safe-area-inset-bottom));
    }
    /* post modal is full-screen but keeps its own internal padding */
    .post-modal{padding:0}
    .comments{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
    .field input,.field textarea,.field select,
    .comment-form input{font-size:16px} /* prevents iOS zoom-on-focus */
    .modal-actions{position:sticky;bottom:0;background:var(--card);padding-top:12px}
  }

  /* single column on very narrow phones */
  @media(max-width:380px){
    .grid{grid-template-columns:1fr}
    .ad .cover{height:150px}
  }
</style>
</head>
<body>

<!-- ===== Splash intro ===== -->
<div class="splash" id="splash">
  <div class="mark">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
      <circle cx="256" cy="256" r="240" fill="#39c46e"/>
      <path d="M 120 120 L 392 120 Q 400 120 400 128 L 400 182 Q 400 190 392 190 L 290 190 Q 282 190 282 198 L 282 392 Q 282 400 274 400 L 238 400 Q 230 400 230 392 L 230 198 Q 230 190 222 190 L 120 190 Q 112 190 112 182 L 112 128 Q 112 120 120 120 Z" fill="#FFFFFF"/>
    </svg>
  </div>
</div>

<header>
  <div class="bar">
    <div class="logo" onclick="resetFeed()">
      <div class="mark-sm">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
          <circle cx="256" cy="256" r="240" fill="#39c46e"/>
          <path d="M 120 120 L 392 120 Q 400 120 400 128 L 400 182 Q 400 190 392 190 L 290 190 Q 282 190 282 198 L 282 392 Q 282 400 274 400 L 238 400 Q 230 400 230 392 L 230 198 Q 230 190 222 190 L 120 190 Q 112 190 112 182 L 112 128 Q 112 120 120 120 Z" fill="#FFFFFF"/>
        </svg>
      </div>
      <div class="name">STOP<small>הרשת המקומית שלך</small></div>
    </div>

    <div class="search">
      <input id="searchInput" type="text" placeholder="חיפוש מקומות, ערים, סוגי מקום…" oninput="render()">
      <span class="icon">🔍</span>
    </div>

    <div class="actions">
      <button class="btn btn-primary btn-sm" onclick="openModal()">＋ שתף מקום</button>
      <div class="avatar">ד</div>
    </div>
  </div>
</header>

<div class="wrap">
  <!-- Sidebar categories -->
  <aside>
    <div class="cats" id="cats">
      <h3>סוגי מקומות</h3>
    </div>
  </aside>

  <!-- Feed -->
  <main>
    <div class="feed-head">
      <div>
        <h2 id="feedTitle">כל המקומות</h2>
        <div class="sub" id="feedSub">מקומות שכדאי לבקר בהם</div>
      </div>
      <div class="chips" id="sortChips">
        <div class="chip active" onclick="setSort('new',this)">🆕 חדשים</div>
        <div class="chip" onclick="setSort('hot',this)">🔥 פופולריים</div>
        <div class="chip" onclick="setSort('near',this)">📍 קרובים</div>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<footer>STOP · שתפו מקומות שביקרתם בהם 💚 · נבנה על ידי Claude עבור דניאל</footer>

<!-- Floating share button (mobile) -->
<button class="fab" type="button" aria-label="שתף מקום" onclick="openModal()">＋</button>

<!-- New post modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2>שיתוף מקום חדש 📍</h2>
    <div class="hint">ביקרת במקום מגניב? שתף אותו עם השכונה!</div>
    <div class="field">
      <label>השם שלך <span class="req">*</span></label>
      <input id="pAuthor" type="text" placeholder="איך קוראים לך?" maxlength="60">
    </div>
    <div class="field">
      <label>שם המקום <span class="req">*</span></label>
      <input id="pTitle" type="text" placeholder="לדוגמה: פארק הירקון">
    </div>
    <div class="field">
      <label>למה כדאי לבקר?</label>
      <textarea id="pDesc" placeholder="ספר לנו על החוויה שלך…"></textarea>
    </div>
    <div class="field">
      <label>סוג מקום</label>
      <select id="pCat"></select>
    </div>
    <div class="field" style="display:flex;gap:12px">
      <div style="flex:1"><label>דירוג</label>
        <select id="pPrice">
          <option>⭐⭐⭐⭐⭐</option>
          <option>⭐⭐⭐⭐</option>
          <option>⭐⭐⭐</option>
          <option>⭐⭐</option>
        </select>
      </div>
      <div style="flex:1"><label>מיקום</label><input id="pLoc" type="text" placeholder="תל אביב"></div>
    </div>
    <div class="field">
      <label>תמונה (אופציונלי)</label>
      <label class="upload-box" id="uploadBox" for="pImage">
        <span id="uploadHint">📷 לחצו כדי לבחור תמונה</span>
        <img id="uploadPreview" style="display:none">
      </label>
      <input id="pImage" type="file" accept="image/*" style="display:none" onchange="handleImage(event)">
      <div id="uploadWarning" style="display:none;color:#c0392b;font-size:13px;margin-top:6px"></div>
      <div style="color:var(--muted);font-size:12px;margin-top:6px">תמונות גדולות מ-4MB יידחסו אוטומטית</div>
    </div>
    <div class="field">
      <label>אייקון</label>
      <div class="emoji-pick" id="emojiPick"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-primary" style="flex:1" onclick="submitPost(this)">שתף 🚀</button>
      <button class="btn btn-ghost-modal" onclick="closeModal()">ביטול</button>
    </div>
  </div>
</div>

<!-- Post detail modal (with comments) -->
<div class="overlay" id="postOverlay">
  <div class="modal post-modal">
    <button class="modal-close" type="button" aria-label="סגור" onclick="closePost()">✕</button>
    <div class="post-cover" id="postCover"></div>
    <div class="post-detail">
      <div class="post-tags">
        <span class="post-cat" id="postCat"></span>
        <span class="post-price" id="postPrice"></span>
      </div>
      <h2 id="postTitle"></h2>
      <div class="post-byline" id="postByline"></div>
      <p class="post-desc" id="postDesc"></p>
      <div class="post-meta" id="postMeta"></div>
      <button class="share-btn" type="button" onclick="sharePost(currentPost)">
        <span class="emoji">🔗</span> שיתוף
      </button>
    </div>

    <div class="comments">
      <h3 id="commentsTitle">תגובות</h3>
      <div class="comment-list" id="commentList"></div>
      <div class="comment-form">
        <input id="cAuthor" type="text" placeholder="השם שלך *" maxlength="60">
        <div class="comment-row">
          <input id="cBody" type="text" placeholder="כתבו תגובה…" maxlength="1000"
                 onkeydown="if(event.key==='Enter')submitComment()">
          <button class="btn btn-primary" type="button" onclick="submitComment()">שלח</button>
        </div>
        <div id="commentWarning" style="display:none;color:#c0392b;font-size:13px;margin-top:4px"></div>
      </div>
    </div>
  </div>
</div>

<script>
/* ===== Data ===== */
const CATEGORIES = [
  {id:'all',        name:'הכל',          emoji:'🌐'},
  {id:'restaurant', name:'מסעדות',       emoji:'🍽️'},
  {id:'cafe',       name:'בתי קפה',      emoji:'☕'},
  {id:'nature',     name:'טבע ופארקים',  emoji:'🌳'},
  {id:'attraction', name:'אטרקציות',     emoji:'🎡'},
  {id:'culture',    name:'תרבות ומוזיאונים', emoji:'🖼️'},
  {id:'beach',      name:'חופים',        emoji:'🏖️'},
  {id:'shopping',   name:'קניות',        emoji:'🛍️'},
  {id:'nightlife',  name:'חיי לילה',     emoji:'🌃'},
  {id:'hiking',     name:'טיולים',       emoji:'🥾'},
];

const COVER_COLORS = ['#eafaf0','#fff4e0','#e6f0ff','#ffe9ef','#f0e9ff','#e9fbf7','#fff9db','#f3f0e8'];

const EMOJIS = ['🍽️','☕','🌳','🎡','🖼️','🏖️','🛍️','🌃','🥾','🍦','🍜','🎭','⛰️','🌅','🎪','🍷','🏛️','🚴','🛶','🎢'];

// Reaction types — order defines display order in each card
const REACTIONS = [
  {type:'heart',   emoji:'❤️', field:'reactions_heart',   label:'אהבתי'},
  {type:'thumb',   emoji:'👍', field:'reactions_thumb',   label:'לייק'},
  {type:'hundred', emoji:'💯', field:'reactions_hundred', label:'מאה אחוז'},
];

let POSTS = [];

async function fetchPosts(){
  try{
    const res = await fetch('/api/posts');
    if(!res.ok) throw new Error('failed to load posts');
    POSTS = await res.json();
  }catch(e){
    console.warn('נכשלה טעינת מקומות', e);
    POSTS = [];
  }
}

function openPostFromHash(){
  const m = /^#post-(.+)$/.exec(location.hash);
  if(!m) return;
  const p = POSTS.find(x=>String(x.id)===m[1]);
  if(p) openPost(p);
}

/* ===== State ===== */
let activeCat = 'all';
let sortMode = 'new';
let selectedEmoji = EMOJIS[0];
let selectedImage = null;

/* ===== Init ===== */
function buildCats(){
  const el = document.getElementById('cats');
  el.innerHTML = '<h3>סוגי מקומות</h3>';
  CATEGORIES.forEach(c=>{
    const d = document.createElement('div');
    d.className = 'cat' + (c.id===activeCat?' active':'');
    d.innerHTML = `<span class="emoji">${c.emoji}</span> ${c.name}`;
    d.onclick = ()=>{ activeCat=c.id; buildCats(); render(); };
    el.appendChild(d);
  });
  // category select in modal
  const sel = document.getElementById('pCat');
  sel.innerHTML = '';
  CATEGORIES.filter(c=>c.id!=='all').forEach(c=>{
    const o=document.createElement('option');o.value=c.id;o.textContent=`${c.emoji} ${c.name}`;sel.appendChild(o);
  });
}

function buildEmojiPicker(){
  const el = document.getElementById('emojiPick');
  el.innerHTML='';
  EMOJIS.forEach(e=>{
    const s=document.createElement('span');
    s.textContent=e;
    if(e===selectedEmoji)s.className='sel';
    s.onclick=()=>{selectedEmoji=e;buildEmojiPicker();};
    el.appendChild(s);
  });
}

function catName(id){ const c=CATEGORIES.find(x=>x.id===id); return c?c.name:id; }
function totalReactions(p){ return REACTIONS.reduce((sum,r)=>sum+(p[r.field]||0),0); }
function ageText(createdAt){
  const h = Math.max(1, Math.round((Date.now() - new Date(createdAt).getTime()) / 3600000));
  return h<=1 ? 'לפני שעה' : (h<24 ? `לפני ${h} שעות` : `לפני ${Math.round(h/24)} ימים`);
}

/* ===== Render feed ===== */
function render(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const seen = new Set();
  let list = POSTS.filter(p=>{ if(seen.has(p.id)) return false; seen.add(p.id); return true; });

  if(activeCat!=='all') list = list.filter(p=>p.category===activeCat);
  if(q) list = list.filter(p=>
    p.title.toLowerCase().includes(q) ||
    p.description.toLowerCase().includes(q) ||
    p.location.toLowerCase().includes(q) ||
    catName(p.category).toLowerCase().includes(q)
  );

  if(sortMode==='hot') list.sort((a,b)=>totalReactions(b)-totalReactions(a));
  else if(sortMode==='new') list.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  else if(sortMode==='near') list.sort((a,b)=>a.location.localeCompare(b.location,'he'));

  // header
  const cat = CATEGORIES.find(c=>c.id===activeCat);
  document.getElementById('feedTitle').textContent = activeCat==='all' ? 'כל המקומות' : `${cat.emoji} ${cat.name}`;
  document.getElementById('feedSub').textContent = q ? `תוצאות חיפוש עבור "${q}" · ${list.length} מקומות` : `${list.length} מקומות באזור שלך`;

  const grid = document.getElementById('grid');
  grid.innerHTML='';
  if(list.length===0){
    grid.innerHTML = `<div class="empty"><div class="big">🔍</div><b>לא נמצאו מקומות</b><br>נסה חיפוש אחר או שתף מקום חדש!</div>`;
    return;
  }
  list.forEach(p=>{
    const card = document.createElement('div');
    card.className='ad';
    const coverContent = p.image_url
      ? `<img src="${p.image_url}" style="width:100%;height:100%;object-fit:cover">`
      : p.emoji;
    card.innerHTML = `
      <div class="cover" style="background:${p.color}">
        ${coverContent}
        <span class="tag">${catName(p.category)}</span>
        <span class="price">${p.price}</span>
      </div>
      <div class="body">
        <h4>${escapeHtml(p.title)}</h4>
        <p>${escapeHtml(p.description)}</p>
        <div class="meta">
          <span class="loc"><span>📍 ${escapeHtml(p.location)} · ${ageText(p.created_at)}</span></span>
          <div class="reactions">
            ${REACTIONS.map(r=>`
              <button class="like-btn" type="button" data-type="${r.type}" aria-label="${r.label}">
                <span class="emoji">${r.emoji}</span> <span class="react-count">${p[r.field]||0}</span>
              </button>`).join('')}
            <button class="like-btn share-btn-card" type="button" aria-label="שיתוף">
              <span class="emoji">🔗</span>
            </button>
          </div>
        </div>
      </div>`;
    card.addEventListener('click', ()=>openPost(p));
    card.querySelectorAll('.like-btn').forEach(btn=>{
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        if(btn.classList.contains('share-btn-card')){ sharePost(p); return; }
        reactToPost(p, btn.dataset.type, this);
      });
    });
    grid.appendChild(card);
  });
}

async function reactToPost(p, type, btn){
  const reaction = REACTIONS.find(r=>r.type===type);
  if(!reaction) return;
  try{
    const res = await fetch(`/api/posts/${p.id}/like`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({type}),
    });
    if(!res.ok) throw new Error('reaction failed');
    const updated = await res.json();
    REACTIONS.forEach(r=>{ if(updated[r.field]!=null) p[r.field]=updated[r.field]; });
  }catch(e){
    console.warn('נכשל עדכון תגובה', e);
    p[reaction.field] = (p[reaction.field]||0) + 1;
  }
  btn.querySelector('.react-count').textContent = p[reaction.field]||0;
  btn.classList.add('reacted');
  btn.style.transition='transform .15s'; btn.style.transform='scale(1.2)';
  setTimeout(()=>btn.style.transform='scale(1)',150);
}

async function sharePost(p){
  if(!p) return;
  const url = `${location.origin}${location.pathname}#post-${p.id}`;
  const text = `${p.title} · 📍 ${p.location}\n${p.description || ''}`.trim();
  const data = { title: p.title, text, url };
  try{
    if(navigator.share && (!navigator.canShare || navigator.canShare(data))){
      await navigator.share(data);
      return;
    }
    await navigator.clipboard.writeText(`${text}\n${url}`);
    toast('הקישור הועתק ללוח 📋');
  }catch(e){
    if(e && e.name === 'AbortError') return; // user cancelled the share sheet
    console.warn('שיתוף נכשל', e);
  }
}

function toast(msg){
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.id = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ===== Post detail + comments ===== */
let currentPost = null;

function openPost(p){
  currentPost = p;
  const cover = document.getElementById('postCover');
  if(p.image_url){
    cover.classList.remove('no-img');
    // blurred fill behind a contained image so vertical/horizontal both look clean
    cover.style.background = `${p.color} url("${p.image_url}") center/cover no-repeat`;
    cover.innerHTML = `<img src="${p.image_url}">`;
  } else {
    cover.classList.add('no-img');
    cover.style.background = p.color;
    cover.innerHTML = p.emoji;
  }
  document.getElementById('postCat').textContent = catName(p.category);
  document.getElementById('postPrice').textContent = p.price;
  document.getElementById('postTitle').textContent = p.title;
  document.getElementById('postByline').innerHTML = `שותף על ידי <b>${escapeHtml(p.author || 'אנונימי')}</b>`;
  document.getElementById('postDesc').textContent = p.description;
  document.getElementById('postMeta').textContent = `📍 ${p.location} · ${ageText(p.created_at)}`;

  document.getElementById('commentList').innerHTML = '<div class="comments-empty">טוען תגובות…</div>';
  document.getElementById('commentsTitle').textContent = 'תגובות';
  document.getElementById('commentWarning').style.display = 'none';
  document.getElementById('postOverlay').classList.add('show');
  history.replaceState(null, '', `#post-${p.id}`);
  loadComments(p.id);
}

function closePost(){
  document.getElementById('postOverlay').classList.remove('show');
  currentPost = null;
  history.replaceState(null, '', location.pathname + location.search);
}
document.getElementById('postOverlay').addEventListener('click',e=>{ if(e.target.id==='postOverlay') closePost(); });

function commentTime(createdAt){
  const m = Math.max(1, Math.round((Date.now() - new Date(createdAt).getTime())/60000));
  if(m < 60) return `לפני ${m} דק׳`;
  const h = Math.round(m/60);
  if(h < 24) return `לפני ${h} שע׳`;
  return `לפני ${Math.round(h/24)} ימים`;
}

function renderComments(comments){
  const list = document.getElementById('commentList');
  document.getElementById('commentsTitle').textContent = `תגובות · ${comments.length}`;
  if(comments.length === 0){
    list.innerHTML = '<div class="comments-empty">אין תגובות עדיין — היו הראשונים! 💬</div>';
    return;
  }
  list.innerHTML = comments.map(c=>`
    <div class="comment">
      <div class="c-head">
        <span class="c-author">${escapeHtml(c.author)}</span>
        <span class="c-time">${commentTime(c.created_at)}</span>
      </div>
      <div class="c-body">${escapeHtml(c.body)}</div>
    </div>`).join('');
}

async function loadComments(postId){
  try{
    const res = await fetch(`/api/posts/${postId}/comments`);
    if(!res.ok) throw new Error('failed to load comments');
    const comments = await res.json();
    if(currentPost && currentPost.id === postId) renderComments(comments);
  }catch(e){
    console.warn('נכשלה טעינת תגובות', e);
    document.getElementById('commentList').innerHTML =
      '<div class="comments-empty">נכשלה טעינת התגובות 😕</div>';
  }
}

async function submitComment(){
  if(!currentPost) return;
  const warn = document.getElementById('commentWarning');
  const author = document.getElementById('cAuthor').value.trim();
  const body = document.getElementById('cBody').value.trim();
  warn.style.display = 'none';

  if(!author){ warn.textContent='צריך שם כדי להגיב 😊'; warn.style.display='block'; return; }
  if(!body){ warn.textContent='כתבו תגובה לפני השליחה'; warn.style.display='block'; return; }

  const postId = currentPost.id;
  try{
    const res = await fetch(`/api/posts/${postId}/comments`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({author, body}),
    });
    if(!res.ok) throw new Error('comment failed');
  }catch(e){
    console.warn('נכשלה שליחת תגובה', e);
    warn.textContent='משהו השתבש בשליחת התגובה, נסו שוב 🙏'; warn.style.display='block';
    return;
  }
  document.getElementById('cBody').value = '';
  loadComments(postId);
}

function setSort(mode, el){
  sortMode=mode;
  document.querySelectorAll('#sortChips .chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  render();
}

function resetFeed(){
  activeCat='all'; sortMode='new';
  document.getElementById('searchInput').value='';
  document.querySelectorAll('#sortChips .chip').forEach((c,i)=>c.classList.toggle('active',i===0));
  buildCats(); render();
}

/* ===== Modal ===== */
function openModal(){ document.getElementById('overlay').classList.add('show'); }
function closeModal(){ document.getElementById('overlay').classList.remove('show'); resetImagePicker(); }
document.getElementById('overlay').addEventListener('click',e=>{ if(e.target.id==='overlay') closeModal(); });

function scrollToFeedAndOpenModal(){
  document.getElementById('feed').scrollIntoView({behavior:'smooth'});
  setTimeout(openModal, 400);
}

let selectedImageFile = null;

const MAX_UPLOAD_BYTES = 4 * 1024 * 1024; // 4MB, safely under Vercel's 4.5MB function body limit
const MAX_IMAGE_DIMENSION = 1600; // px, longest side

function fileToImage(file){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>resolve(img);
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

async function compressImage(file, quality){
  const img = await fileToImage(file);
  const scale = Math.min(1, MAX_IMAGE_DIMENSION / Math.max(img.width, img.height));
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(img.width * scale);
  canvas.height = Math.round(img.height * scale);
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  URL.revokeObjectURL(img.src);
  return new Promise(resolve=>{
    canvas.toBlob(blob=>resolve(blob), 'image/jpeg', quality);
  });
}

async function autoReduceImageQuality(file){
  // Skip non-raster files (canvas re-encode only works on images)
  if(!file.type.startsWith('image/')) return file;
  let quality = 0.85;
  let blob = await compressImage(file, quality);
  while(blob && blob.size > MAX_UPLOAD_BYTES && quality > 0.3){
    quality -= 0.15;
    blob = await compressImage(file, quality);
  }
  if(!blob || blob.size > MAX_UPLOAD_BYTES) return file; // give up, let size warning handle it
  return new File([blob], (file.name || 'upload').replace(/\.\w+$/, '') + '.jpg', { type:'image/jpeg' });
}

function handleImage(e){
  const file = e.target.files[0];
  if(!file) return;
  handleImageAsync(file);
}

async function handleImageAsync(file){
  const warningEl = document.getElementById('uploadWarning');
  warningEl.style.display = 'none';

  let finalFile = file;
  if(file.size > MAX_UPLOAD_BYTES){
    finalFile = await autoReduceImageQuality(file);
  }

  if(finalFile.size > MAX_UPLOAD_BYTES){
    warningEl.textContent = `⚠️ התמונה גדולה מדי (מקסימום 4MB) גם לאחר דחיסה. נסו תמונה אחרת.`;
    warningEl.style.display = 'block';
    return;
  }

  selectedImageFile = finalFile;
  const reader = new FileReader();
  reader.onload = ()=>{
    selectedImage = reader.result;
    document.getElementById('uploadHint').style.display='none';
    const preview = document.getElementById('uploadPreview');
    preview.src = selectedImage;
    preview.style.display='block';
  };
  reader.readAsDataURL(finalFile);
}

function resetImagePicker(){
  selectedImage = null;
  selectedImageFile = null;
  document.getElementById('pImage').value = '';
  document.getElementById('uploadHint').style.display='block';
  document.getElementById('uploadWarning').style.display='none';
  const preview = document.getElementById('uploadPreview');
  preview.src=''; preview.style.display='none';
}

async function uploadSelectedImage(){
  if(!selectedImageFile) return null;
  const res = await fetch('/api/upload', {
    method:'POST',
    headers:{
      'Content-Type': selectedImageFile.type || 'application/octet-stream',
      'X-Filename': selectedImageFile.name || 'upload',
    },
    body: selectedImageFile,
  });
  if(!res.ok) throw new Error('image upload failed');
  const { url } = await res.json();
  return url;
}

let submitting = false;
async function submitPost(btn){
  if(submitting) return; // prevent double-submit → duplicate posts
  const author = document.getElementById('pAuthor').value.trim();
  if(!author){ alert('צריך למלא את השם שלך 😊'); return; }
  const title = document.getElementById('pTitle').value.trim();
  if(!title){ alert('צריך כותרת לפרסום 😊'); return; }
  const description = document.getElementById('pDesc').value.trim() || 'ללא תיאור';
  const category = document.getElementById('pCat').value;
  const price = document.getElementById('pPrice').value;
  const location = document.getElementById('pLoc').value.trim() || 'לא צוין';
  const color = COVER_COLORS[Math.floor(Math.random()*COVER_COLORS.length)];

  submitting = true;
  if(btn){ btn.disabled = true; btn.dataset.label = btn.textContent; btn.textContent = 'משתף…'; }
  try{
    const image_url = await uploadSelectedImage();
    const res = await fetch('/api/posts', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({title,description,category,price,location,author,emoji:selectedEmoji,color,image_url}),
    });
    if(!res.ok) throw new Error('post creation failed');
    const post = await res.json();
    if(!POSTS.some(p=>p.id===post.id)) POSTS.unshift(post); // dedup by id
  }catch(e){
    console.warn('נכשל פרסום המקום', e);
    alert('משהו השתבש בשמירת המקום, נסו שוב 🙏');
    return;
  }finally{
    submitting = false;
    if(btn){ btn.disabled = false; if(btn.dataset.label) btn.textContent = btn.dataset.label; }
  }

  closeModal();
  // reset form (keep author name for convenience)
  ['pTitle','pDesc','pLoc'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('pPrice').selectedIndex = 0;
  selectedEmoji=EMOJIS[0]; buildEmojiPicker();
  resetImagePicker();
  activeCat='all'; buildCats();
  render();
}

function escapeHtml(s){ return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ===== Boot ===== */
(async function init(){
  buildCats();
  buildEmojiPicker();
  await fetchPosts();
  render();
  openPostFromHash();
})();
window.addEventListener('hashchange', openPostFromHash);

/* ===== Splash intro timing ===== */
document.body.classList.add('splash-active');
setTimeout(()=>{
  const splash = document.getElementById('splash');
  splash.classList.add('fade-out');
  document.body.classList.remove('splash-active');
  setTimeout(()=>splash.remove(), 750);
}, 950);
</script>
</body>
